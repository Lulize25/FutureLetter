name: Build APK

# 推送代码或手动触发时构建
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 明确授予创建 Issue / Release 的权限（新仓库默认 token 为只读）
    permissions:
      contents: write
      issues: write
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 配置 Gradle 8.9（无需 wrapper jar）
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # ubuntu-latest 镜像自带 Android SDK，直接用完整路径调用 sdkmanager
      - name: 安装 SDK 组件（Android 15 平台 + 构建工具）
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ls -la "$ANDROID_HOME/cmdline-tools/latest/bin/" || true
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: 构建 Release APK
        run: |
          if ! gradle assembleRelease --stacktrace > build.log 2>&1; then
            exit 1
          fi

      # 构建失败时自动把日志创建为 Issue，便于排查（可在仓库 Issues 页查看）
      - name: 构建失败时自动记录日志
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('build.log', 'utf8');
            const lines = log.split('\n');
            const tail = lines.slice(-150).join('\n');
            const errors = lines.filter(l => l.startsWith('e:') || l.includes('error:')).join('\n');
            const body = '## 构建日志（末尾 150 行）\n```\n' + tail + '\n```\n\n## 错误行\n```\n' + errors + '\n```';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '构建失败 @ ' + context.sha.slice(0, 7),
              body: body
            });

      - name: 读取版本号
        id: ver
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "版本: $VERSION"

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: 日记-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 构建成功后：自动关闭历史遗留的“构建失败”Issue
      - name: 构建成功时清理旧失败 Issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', per_page: 100
            });
            for (const i of issues.data) {
              if (i.title.startsWith('构建失败')) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: i.number, body: '后续构建已通过，自动关闭。'
                });
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: i.number, state: 'closed'
                });
              }
            }

      # 构建成功后：发布/更新 GitHub Release，附带 APK
      - name: 发布 Release
        if: success() && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: 日记 v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
